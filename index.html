<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ufoplayer</title>
<link rel="stylesheet" href="./Controller_files/style.css">
<!-- fflate: 浏览器内解压 ZIP（国内若 CDN 受限，可把此文件下载到本地） -->
<script src="./Controller_files/fflate.min.js"></script>
<link rel="icon" href="./Controller_files/favicon.ico" type="image/x-icon">
<link rel="manifest" href="./Controller_files/manifest.json" />
</head>
<body>

<div id="toolbar">
  <button id="btnSidebar" onclick="toggle_sidebar()" title="播放列表">☰</button>
  <button id="btnBLE" onclick="ble_connect()">🔵 连接蓝牙</button>
  <span id="bleLabel" class="badge off">未连接</span>
  <button id="btnFolder" onclick="folder_open()">📁 打开文件 / ZIP</button>
  <span id="folderLabel"></span>
  <button id="btnAdd" onclick="add_single_file()" title="再添加一个文件">➕ 追加文件</button>
  <button id="btnFlip" onclick="flip_toggle()" title="交换左右电机">🔀 交换左右电机</button>
</div>

<!-- 支持一次选中 多个文件 或 单个 zip -->
<input type="file" id="fileInput" multiple
       accept=".zip,video/*,audio/*,.csv,.vtt,.mp4,.webm,.mkv,.mov,.avi,.mp3,.wav,.ogg,.flac,.m4a"
       style="display:none">

<!-- 移动端追加文件（单选，避免 Android 多选问题） -->
<input type="file" id="singleFileInput"
       accept=".zip,video/*,audio/*,.csv,.vtt"
       style="display:none">

<div id="sidebarBackdrop" onclick="close_sidebar()"></div>

<div id="layout">
  <div id="sidebar">
    <div id="playlist"></div>
  </div>
  <div id="main">
    <div id="playerBox">
      <video id="player" controls playsinline webkit-playsinline hidden></video>
      <div id="subDisplay"></div>
      <div id="placeholder">📂 点击"打开文件 / ZIP"加载媒体</div>
    </div>
    <div id="statusBar">
      <div id="waveWrap"><canvas id="waveCanvas"></canvas><div id="wavePos"></div></div>
      <div id="timeText">00:00 / 00:00</div>
      <div id="actionText">未加载脚本</div>
    </div>
  </div>
</div>

<script src="./Controller_files/app.js"></script>
</body></html>
